# Render Blueprint — Pryme Cloud (free web service)
services:
  - type: web
    name: pryme-cloud
    runtime: node
    plan: free
    region: singapore
    buildCommand: echo "no build needed"
    startCommand: node cloud/server.js
    healthCheckPath: /healthz
    envVars:
      - key: PRYME_USERNAME
        sync: false
      - key: PRYME_PASSWORD
        sync: false
      - key: PRYME_AGENT_KEY
        sync: false
      - key: PLUG_TYPE
        value: none
      - key: PLUG_CUT_AFTER_SHUTDOWN
        value: "1"
      - key: TUYA_ENDPOINT
        value: https://openapi.tuyaeu.com
      - key: TUYA_CLIENT_ID
        sync: false
      - key: TUYA_SECRET
        sync: false
      - key: TUYA_DEVICE_ID
        sync: false
